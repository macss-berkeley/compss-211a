    "google-genai==2.11.0",
    "ipykernel==7.3.0",
    "jupyterlab==4.6.3",
    "matplotlib==3.10.0",
    "nltk==3.9.1",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "pymupdf==1.28.2",
    "requests==2.32.4",
    "scikit-learn==1.6.1",
    "seaborn==0.13.2",
    "trafilatura==2.2.0",
]

